<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Blackwell Dictionary</title>
<style>
:root{color-scheme:dark;--out:#0a0c0f;--bg:#101418;--tx:#eaecf0;--mu:#a2a9b1;--ln:#3a4047;--lk:#88a6ff;--pn:#1b2025;--ac:#2b3a55}
*{box-sizing:border-box}
html,body{margin:0;background:var(--out);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
a,.lk{color:var(--lk);text-decoration:none;cursor:pointer}
a:hover,.lk:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lk);outline-offset:2px}
#wrap{max-width:none;margin:0;background:var(--bg);min-height:100vh;padding:0 4vw 60px}
header{display:flex;align-items:flex-start;gap:28px;padding:22px 0 14px;flex-wrap:wrap}
.mark{font:400 26px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.02em;cursor:pointer;color:var(--tx);white-space:nowrap}
.mark small{display:block;font:11px/1.4 Georgia,serif;color:var(--mu);letter-spacing:0;margin-top:2px}
form{position:relative;flex:1;min-width:240px;max-width:760px;display:flex;margin-top:4px}
#q{flex:1;background:var(--bg);border:1px solid var(--ln);border-right:0;padding:7px 10px;border-radius:2px 0 0 2px;min-width:0}
#go{background:var(--pn);border:1px solid var(--ln);padding:7px 14px;font-weight:600;cursor:pointer;border-radius:0 2px 2px 0}
#sug{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--ln);border-top:0;margin:0;padding:0;list-style:none;z-index:5}
#sug li{padding:7px 10px;cursor:pointer}
#sug li:hover,#sug li.on{background:var(--ac)}
#sug b{font-weight:700}
.tabs{border-bottom:1px solid var(--ln);margin-bottom:18px}
.tabs span{display:inline-block;padding:6px 0;border-bottom:2px solid var(--tx);font-size:14px;cursor:pointer}
.box{border:1px solid var(--tx);text-align:center;padding:18px;margin-bottom:16px}
.box h1{font:400 28px/1.3 system-ui,sans-serif;margin:0 0 4px}
.muted{color:var(--mu)}
.err{color:#f0a0a0}
.nf{border:1px solid var(--ln);padding:18px;background:var(--pn)}
.nf h2{margin:0 0 4px;font-size:20px}
.entry{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:20px 24px;margin-bottom:22px}
.entry h2{font:500 40px/1.1 system-ui,sans-serif;margin:0 0 12px}
.entry h2 sup{font-size:18px;margin-left:3px}
.pron{display:flex;align-items:center;gap:12px;color:var(--mu)}
.spk{background:none;border:0;cursor:pointer;padding:4px;color:var(--lk);display:flex}
.spk svg{width:22px;height:22px;fill:currentColor}
.pos{font-size:12px;text-transform:uppercase;color:var(--mu);margin:22px 0 4px}
ol{margin:6px 0 0;padding-left:26px}
ol li{margin:0 0 14px;padding-left:6px}
ol li::marker{color:var(--mu)}
blockquote{margin:6px 0 0;border-left:3px solid var(--ln);padding-left:12px;font-style:italic;color:var(--mu)}
.ft{font:400 20px/1.3 Georgia,serif;border-bottom:1px solid var(--ln);margin:26px 0 10px;padding-bottom:4px}
.fw{padding:8px 0;border-bottom:1px solid #20262c;animation:fi .5s}
.fw i{color:var(--mu);font-size:13px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.fw{animation:none}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.pn{border:1px solid var(--ln);margin-bottom:16px}.cols .pn{margin-bottom:0}
.pn h2{margin:0;padding:6px 12px;font:700 17px/1.4 system-ui,sans-serif;border-bottom:1px solid var(--ln)}
.pn.g{border-color:#1f4a3a}.pn.g h2{background:#10261e;border-color:#1f4a3a}
.pn.b{border-color:#2a3d63}.pn.b h2{background:#101c33;border-color:#2a3d63}
.pb{padding:12px 14px}
.wotd h3{font:400 34px/1.2 Georgia,serif;margin:0 0 4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{border:1px solid #232a31;padding:8px 10px;min-height:92px;animation:fi .6s}
.card i{color:var(--mu);font-size:13px}.card div{font-size:14px;color:var(--mu);margin-top:2px}
.az{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.az span{border:1px solid var(--ln);padding:1px 10px;cursor:pointer}.az span:hover,.az span.on{background:var(--ac)}
.pb ul{margin:0;padding-left:20px}.pb li{margin-bottom:6px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.rel{margin:2px 0 0;font-size:14px;color:var(--mu)}
.rel .lk{margin-right:2px}
#chat{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;position:fixed;inset:0;background:#121212;display:flex;flex-direction:column;z-index:10}
.ch-top{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;border-bottom:1px solid #2a2a2a;position:relative;min-height:68px}
.ch-top select,.ch-top button{background:#1c1c1c;border:1px solid #333;border-radius:8px;padding:6px 10px;cursor:pointer;max-width:42vw}
.ctr{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.ctr b,#hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.02em}
.ctr b{display:block;font-size:20px}
.ctr span{font-size:12px;color:#9a9a9a}
#msgs{flex:1;overflow:auto;padding:20px 16px}
.m{width:min(730px,calc(100% - 32px));margin:0 auto 16px}
.bb{display:block;width:fit-content;max-width:100%;background:#1f1f1f;border-radius:14px;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;text-align:left}
#hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12vh;text-align:center}
#hero h1{font-size:26px;margin:0}
#hero p{margin:4px 0 14px;color:#9a9a9a}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips button{background:#1c1c1c;border:1px solid #333;border-radius:999px;padding:8px 14px;cursor:pointer}
.chips button:hover{background:#262626}
.comp{width:min(730px,calc(100% - 32px));margin:0 auto;display:flex;align-items:center;gap:10px;background:#1b1b1b;border:1px solid #2f2f2f;border-radius:999px;padding:8px 8px 8px 10px}
.comp input[type=text]{flex:1;background:none;border:0;outline:0;min-width:0}
.comp .pl,.comp .sd{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;font-size:18px;flex:none}
.comp .pl{background:#262626}
.comp .sd{background:#f2efe6;color:#222;font-weight:700}
.nc{width:min(730px,calc(100% - 32px));margin:6px auto 14px;text-align:right;font-size:12px}
.nc a{color:#cfc6b4;text-decoration:underline}
.bot{position:absolute;left:0;top:0;width:76px;height:76px;z-index:12;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform}
.bot.grab{cursor:grabbing}
.bot img{width:100%;height:100%;display:block;pointer-events:none}
.bot.home img{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.bot.home img{animation:none}}
#tip{position:fixed;right:14px;bottom:12px;font-size:12px;color:#8a8a8a;background:#1a1a1a;border:1px solid #2c2c2c;border-radius:6px;padding:5px 9px;max-width:220px}
@media(max-width:700px){#wrap{padding:0 14px 40px}.ctr{position:static;transform:none}.ch-top{flex-wrap:wrap}#tip{position:static;margin:0 16px 10px;max-width:none}}
</style>
</head>
<body>

<div id="dict"><div id="wrap">
  <header>
    <div class="mark" id="home">Blackwell Dictionary<small>the free dictionary</small></div>
    <form id="f" autocomplete="off">
      <input id="q" type="search" placeholder="Search for a word" aria-label="Search for a word" autocomplete="off" spellcheck="false">
      <button id="go" type="submit">Search</button>
      <ul id="sug" role="listbox" hidden></ul>
    </form>
  </header>
  <div class="tabs"><span id="tab">Main Page</span></div>
  <main id="out"></main>
</div></div>

<div id="chat" hidden>
  <div class="ch-top">
    <div class="ctr"><b>"Backspace"</b><span>welcome to the goods</span></div>
  </div>
  <div id="hero">
    <h1>"Backspace"</h1>
    <p>welcome to the goods</p>
    <div class="chips">
      <button type="button">Write an essay</button><button type="button">Explain a topic</button><button type="button">Draft an email</button><button type="button">Brainstorm</button>
    </div>
  </div>
  <div id="msgs" hidden></div>
  <div class="comp">
    <button class="pl" id="plus" type="button" aria-label="Attach a text file">+</button>
    <input id="file" type="file" accept=".txt,.md,.csv,.json,.html,.js,.py" hidden>
    <input id="cin" type="text" placeholder='Message "Backspace"' autocomplete="off">
    <button class="sd" id="send" type="button" aria-label="Send">&uarr;</button>
  </div>
  <div class="nc"><a id="newchat" href="#" onclick="return false">New chat</a></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const q=$("#q"),sug=$("#sug"),out=$("#out");
const D=(w,p,d)=>({w,p,d});
const WORDS=[D("serendipity","noun","the occurrence of fortunate events by chance."),D("ephemeral","adjective","lasting for a very short time."),D("lexicon","noun","the vocabulary of a language, person, or branch of knowledge."),D("quixotic","adjective","extremely idealistic; unrealistic and impractical."),D("petrichor","noun","the pleasant smell that accompanies the first rain after a dry spell."),D("mellifluous","adjective","sweet or musical; pleasant to hear."),D("ubiquitous","adjective","present, appearing, or found everywhere."),D("labyrinth","noun","a complicated network of paths or passages; a maze."),D("eloquent","adjective","fluent or persuasive in speaking or writing."),D("nebula","noun","a cloud of gas and dust in outer space."),D("paradigm","noun","a typical example or pattern of something; a model."),D("resilient","adjective","able to recover quickly from difficulties."),D("solitude","noun","the state of being alone."),D("whimsical","adjective","playfully quaint or fanciful."),D("zenith","noun","the time at which something is most powerful or successful."),D("cascade","noun","a small waterfall, typically one of several."),D("enigma","noun","a person or thing that is mysterious or difficult to understand."),D("gregarious","adjective","fond of company; sociable."),D("luminous","adjective","giving off light; bright or shining."),D("meticulous","adjective","showing great attention to detail."),D("candor","noun","the quality of being open and honest."),D("verbose","adjective","using more words than necessary."),D("pragmatic","adjective","dealing with things sensibly and realistically."),D("benevolent","adjective","well meaning and kindly."),D("tenacious","adjective","holding firmly to something; persistent."),D("vivid","adjective","producing powerful feelings or clear images in the mind."),D("amiable","adjective","having a friendly and pleasant manner."),D("oblivion","noun","the state of being unaware of what is happening around one."),D("nostalgia","noun","a sentimental longing for the past."),D("catalyst","noun","a person or thing that causes change.")];
const IDIOMS=[["Break the ice","to do something that makes people feel more relaxed in a social situation."],["Spill the beans","to reveal a secret."],["Once in a blue moon","very rarely."],["Piece of cake","something that is very easy to do."],["Under the weather","feeling slightly ill."],["Hit the books","to study hard."]];
const FACTS=["Samuel Johnson’s A Dictionary of the English Language was first published in 1755.","Noah Webster published An American Dictionary of the English Language in 1828.","The word dictionary comes from Medieval Latin dictionarium, from the Latin dictio, meaning “a saying.”","Set and run are among the words with the most separate meanings in the Oxford English Dictionary."];
const BACKSPACE={word:"backspace",phonetic:"/ˈbækˌspeɪs/",phonetics:[],meanings:[
 {partOfSpeech:"noun",definitions:[{definition:"a key on a keyboard that deletes the character to the left of the cursor.",example:"He hit backspace to fix the typo."}]},
 {partOfSpeech:"verb",definitions:[{definition:"to move the cursor back one space, usually deleting the character there.",example:"She backspaced over the whole sentence and started again."}]}]};
let curAudio=null,sugList=[],sugIdx=-1,sugTimer,sugSeq=0;

/* ---------- views ---------- */
function home(){
  q.value="";hideSug();stopFeed();
  const day=Math.floor(Date.now()/864e5),wd=WORDS[day%WORDS.length],id=IDIOMS[day%IDIOMS.length];
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l=>'<span data-l="'+l.toLowerCase()+'">'+l+'</span>').join("");
  out.innerHTML=
  '<div class="box"><h1>Welcome to Blackwell Dictionary,</h1><div>the free dictionary for every word in English.</div><div class="muted">Type a word in the search bar above. <span class="lk" id="rand">Random word</span></div></div>'+
  '<div class="cols"><div class="pn g wotd"><h2>Word of the day</h2><div class="pb"><h3>'+esc(wd.w)+'</h3><div class="pron"><button class="spk" data-w="'+esc(wd.w)+'" data-a="" data-s="0" aria-label="Pronounce '+esc(wd.w)+'"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button><i>'+esc(wd.p)+'</i></div><p>'+esc(wd.d)+'</p><span class="lk" data-w="'+esc(wd.w)+'">Full entry</span></div></div>'+
  '<div class="pn b"><h2>Featured words</h2><div class="pb"><div id="grid"></div></div></div></div>'+
  '<div class="cols"><div class="pn b"><h2>Browse by letter</h2><div class="pb"><div class="az">'+letters+'</div><div id="azres" class="muted">Pick a letter to see words that start with it.</div></div></div>'+
  '<div class="pn g"><h2>Did you know …</h2><div class="pb"><ul>'+FACTS.map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul></div></div></div>'+
  '<div class="pn b"><h2>Idiom of the day</h2><div class="pb"><b>'+esc(id[0])+'</b> — '+esc(id[1])+'</div></div>';
  $("#rand").onclick=()=>search(WORDS[Math.floor(Math.random()*WORDS.length)].w);
  startGrid();
}
let feedTok=0;
function stopFeed(){feedTok++}
function cardHTML(x){return '<span class="lk" data-w="'+esc(x.w)+'">'+esc(x.w)+'</span> <i>'+esc(x.p)+'</i><div>'+esc(x.d)+'</div>'}
function startGrid(){
  const tok=++feedTok,grid=$("#grid");let n=Math.floor(Math.random()*WORDS.length),pos=0;
  for(let i=0;i<8;i++){const c=document.createElement("div");c.className="card";c.innerHTML=cardHTML(WORDS[n++%WORDS.length]);grid.appendChild(c)}
  const iv=setInterval(()=>{
    if(tok!==feedTok){clearInterval(iv);return}
    if(document.hidden||$("#dict").hidden)return;
    const c=grid.children[pos++%8];c.style.animation="none";void c.offsetHeight;c.style.animation="";
    c.innerHTML=cardHTML(WORDS[n++%WORDS.length]);
  },2500);
}
async function azLoad(l){
  const r=$("#azres");r.textContent="Loading…";
  document.querySelectorAll(".az span").forEach(x=>x.classList.toggle("on",x.dataset.l===l));
  try{
    const j=await (await fetch("https://api.datamuse.com/words?max=80&sp="+l+"*")).json();
    const w=j.map(x=>x.word).filter(x=>/^[a-z]+$/.test(x));
    r.innerHTML=w.length?w.map(x=>'<span class="lk" data-w="'+esc(x)+'">'+esc(x)+'</span>').join(" · "):"No words found.";
  }catch(e){r.textContent="Couldn’t load words. Check your internet connection."}
}
function showChat(){$("#chat").hidden=false;$("#dict").hidden=true;botReset();$("#cin").focus()}
function exitChat(){
  botReset();
  $("#chat").hidden=true;$("#dict").hidden=false;
  hist=[];$("#msgs").innerHTML="";$("#msgs").hidden=true;$("#hero").hidden=false;$("#cin").value="";
  home();window.scrollTo(0,0);
}

/* ---------- dictionary ---------- */
async function search(term){
  term=term.trim();if(!term)return;
  stopFeed();q.value=term;hideSug();
  if(term==="Backspace"){render([BACKSPACE],true);return}
  out.innerHTML='<p class="muted">Loading…</p>';
  try{
    const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(term.toLowerCase()));
    if(r.status===404){
      if(term.toLowerCase()==="backspace"){render([BACKSPACE],false);return}
      out.innerHTML='<div class="nf"><h2>Word not found</h2><div class="muted">There is no entry for “'+esc(term)+'”. Check the spelling or try another word.</div></div>';return}
    if(!r.ok)throw 0;
    render(await r.json(),false);
  }catch(e){out.innerHTML='<p class="err">Couldn’t reach the dictionary service. Check your internet connection (or try again in a minute).</p>'}
}
function render(list,special){
  out.innerHTML=list.map((e,i)=>{
    const ph=e.phonetic||(e.phonetics||[]).map(p=>p.text).find(Boolean)||"";
    const au=(e.phonetics||[]).map(p=>p.audio).find(Boolean)||"";
    const m=(e.meanings||[]).map(x=>{
      const defs=x.definitions.map(d=>'<li>'+esc(d.definition)+(d.example?'<blockquote>'+esc(d.example)+'</blockquote>':'')+'</li>').join("");
      const rel=(l,a)=>a&&a.length?'<p class="rel">'+l+': '+a.slice(0,8).map(w=>'<span class="lk" data-w="'+esc(w)+'">'+esc(w)+'</span>').join(", ")+'</p>':'';
      return '<div class="pos">'+esc(x.partOfSpeech)+'</div><ol>'+defs+'</ol>'+rel("Synonyms",x.synonyms)+rel("Antonyms",x.antonyms);
    }).join("");
    return '<section class="entry"><h2>'+esc(e.word)+(list.length>1?'<sup>'+(i+1)+'</sup>':'')+'</h2>'+
      '<div class="pron"><button class="spk" data-w="'+esc(e.word)+'" data-a="'+esc(au)+'" data-s="'+(special?1:0)+'" aria-label="Pronounce '+esc(e.word)+'"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>'+(ph?'<span>'+esc(ph)+'</span>':'')+'</div>'+m+'</section>';
  }).join("");
}
out.addEventListener("click",e=>{
  const L=e.target.closest("[data-l]");if(L){azLoad(L.dataset.l);return}
  const s=e.target.closest(".spk"),w=e.target.closest("[data-w]");
  if(s){
    if(s.dataset.s==="1"){showChat();return}
    speak(s.dataset.w,s.dataset.a);
  }else if(w&&w.classList.contains("lk"))search(w.dataset.w);
});
function speak(word,audio){
  try{if(curAudio)curAudio.pause();speechSynthesis.cancel()}catch(e){}
  const tts=()=>{try{const u=new SpeechSynthesisUtterance(word);u.lang="en-US";speechSynthesis.speak(u)}catch(e){}};
  if(audio){curAudio=new Audio(audio);curAudio.play().catch(tts)}else tts();
}

/* ---------- suggestions ---------- */
function hideSug(){sug.hidden=true;sug.innerHTML="";sugList=[];sugIdx=-1}
function showSug(words,v){
  sugList=words;sugIdx=-1;
  if(!words.length){sug.hidden=true;return}
  const lv=v.toLowerCase();
  sug.innerHTML=words.map((w,i)=>{const p=w.toLowerCase().startsWith(lv);
    return '<li role="option" data-i="'+i+'">'+(p?'<b>'+esc(w.slice(0,v.length))+'</b>'+esc(w.slice(v.length)):esc(w))+'</li>'}).join("");
  sug.hidden=false;
}
async function suggest(v){
  const my=++sugSeq;let words=[];
  try{const r=await fetch("https://api.datamuse.com/sug?max=8&s="+encodeURIComponent(v));words=(await r.json()).map(x=>x.word)}catch(e){}
  if(my===sugSeq&&q.value.trim()===v)showSug(words,v);
}
q.addEventListener("input",()=>{clearTimeout(sugTimer);const v=q.value.trim();if(!v){sugSeq++;hideSug();return}sugTimer=setTimeout(()=>suggest(v),120)});
q.addEventListener("keydown",e=>{
  if(sug.hidden)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();sugIdx=(sugIdx+(e.key==="ArrowDown"?1:-1)+sugList.length)%sugList.length;
    [...sug.children].forEach((li,i)=>li.classList.toggle("on",i===sugIdx));
  }else if(e.key==="Escape")hideSug();
  else if(e.key==="Enter"&&sugIdx>=0){e.preventDefault();search(sugList[sugIdx])}
});
sug.addEventListener("mousedown",e=>{const li=e.target.closest("li");if(li){e.preventDefault();search(sugList[li.dataset.i])}});
q.addEventListener("blur",()=>setTimeout(hideSug,120));
$("#f").addEventListener("submit",e=>{e.preventDefault();search(q.value)});
$("#home").onclick=$("#tab").onclick=home;

/* ---------- chat ---------- */
let hist=[],busy=false;
const cin=$("#cin"),msgs=$("#msgs");
function add(role,text){
  $("#hero").hidden=true;msgs.hidden=false;
  const d=document.createElement("div");d.className="m";
  const bub=document.createElement("div");bub.className="bb "+role;bub.textContent=text;
  d.appendChild(bub);msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return bub;
}
const LOCAL_MODEL="gemini-3.8-flash";
async function askDirect(){
  let key=store.get("bw_key_gemini");
  if(!key){key=(prompt("Chat isn’t connected to a server here. Paste a Gemini API key to test it locally (saved only in this browser):")||"").trim();if(key)store.set("bw_key_gemini",key)}
  if(!key)throw new Error("No API key. On Netlify, set GEMINI_API_KEY in Site settings.");
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+LOCAL_MODEL+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:hist.map(h=>({role:h.role==="assistant"?"model":"user",parts:[{text:h.content}]}))})});
  const j=await r.json();if(!r.ok){if(r.status===400||r.status===403)store.set("bw_key_gemini","");throw new Error(j.error&&j.error.message||("Error "+r.status))}
  const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];
  const t=parts.map(x=>x.text||"").join("");if(!t)throw new Error("The model returned no text.");return t;
}
async function ask(){
  try{
    const r=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:hist})});
    if(r.ok){const j=await r.json();if(j.text)return j.text;throw new Error("The model returned no text.")}
    if(r.status!==404&&r.status!==405){let j={};try{j=await r.json()}catch(e){}throw new Error(j.error||("Error "+r.status))}
  }catch(e){if(!(e instanceof TypeError))throw e}
  return askDirect();
}
async function send(text){
  text=(text||cin.value).trim();if(!text||busy)return;
  cin.value="";botsHome();add("u",text);hist.push({role:"user",content:text});
  busy=true;const w=add("a","…");
  try{const t=await ask();hist.push({role:"assistant",content:t});w.textContent=t}
  catch(e){hist.pop();w.textContent="Something went wrong: "+e.message}
  busy=false;msgs.scrollTop=msgs.scrollHeight;
}
$("#send").onclick=()=>send();
cin.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send()}});
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{cin.value=b.textContent+": ";cin.focus()});
$("#newchat").onclick=()=>{hist=[];msgs.innerHTML="";msgs.hidden=true;$("#hero").hidden=false;cin.value="";cin.focus()};
$("#plus").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();cin.value=cin.value+"\n["+f.name+"]\n"+t.slice(0,20000);e.target.value=""};


/* ---------- emblems: ragdoll physics; they go home when you send a chat ---------- */
const tpl=$("#bot"),BS=76,TAU=Math.PI*2,MAXB=128;
const bots=[];let braf=0,blast=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function homeOf(i){
  const col=Math.min(730,innerWidth-32),hx=Math.max(8,(innerWidth-col)/2-BS-16);
  const rows=Math.max(1,Math.floor((innerHeight-96-150)/(BS+8)));
  return{x:Math.max(4,hx-Math.floor(i/rows)*(BS+8)),y:96+(i%rows)*(BS+8)};
}
const place=b=>{b.el.style.transform="translate("+b.x+"px,"+b.y+"px) rotate("+b.a+"rad)"};
function kick(){if(!braf){blast=performance.now();braf=requestAnimationFrame(loop)}}
function setHome(b,i){const h=homeOf(i);b.x=h.x;b.y=h.y;b.a=0;b.w=b.vx=b.vy=0;b.mode="home";b.el.classList.add("home");place(b)}
function ptrVel(b){
  const now=performance.now(),r=b.samples.filter(s=>now-s.t<120);
  if(r.length<2)return{x:0,y:0};
  const a=r[0],c=r[r.length-1],d=(c.t-a.t)/1000;
  return d>.01?{x:(c.x-a.x)/d,y:(c.y-a.y)/d}:{x:0,y:0};
}
function makeBot(el){
  const b={el,x:0,y:0,a:0,vx:0,vy:0,w:0,mode:"home",drag:null,samples:[]};
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();el.setPointerCapture(e.pointerId);
    b.mode="drag";el.classList.remove("home");el.classList.add("grab");
    b.drag={dx:e.clientX-b.x,dy:e.clientY-b.y};b.samples=[{x:e.clientX,y:e.clientY,t:performance.now()}];kick();
  });
  el.addEventListener("pointermove",e=>{
    if(b.mode!=="drag")return;
    b.x=clamp(e.clientX-b.drag.dx,0,innerWidth-BS);b.y=clamp(e.clientY-b.drag.dy,0,innerHeight-BS);
    const n=performance.now();b.samples.push({x:e.clientX,y:e.clientY,t:n});b.samples=b.samples.filter(s=>n-s.t<150);
  });
  const up=()=>{
    if(b.mode!=="drag")return;
    el.classList.remove("grab");
    const v=ptrVel(b);
    b.vx=clamp(v.x,-2500,2500);b.vy=clamp(v.y,-2500,2500);
    b.w=clamp(b.w+b.vx*.007,-22,22);          /* spins in the air */
    b.mode="free";kick();
  };
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  return b;
}
function loop(t){
  braf=0;
  const dt=Math.min(.033,(t-blast)/1000||.016);blast=t;
  const mx=innerWidth-BS,my=innerHeight-BS,e=.84,k=.004;
  let active=false;
  bots.forEach((b,i)=>{
    if(b.mode==="drag"){
      const v=ptrVel(b),target=clamp(v.x*.0014,-1.1,1.1);
      b.w+=(70*(target-b.a)-8*b.w)*dt;b.a+=b.w*dt;active=true;       /* hangs and swings */
    }else if(b.mode==="free"){
      b.vy+=650*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)*e;b.w+=b.vy*k}else if(b.x>mx){b.x=mx;b.vx=-Math.abs(b.vx)*e;b.w-=b.vy*k}
      if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)*e;b.w-=b.vx*k}else if(b.y>my){b.y=my;b.vy=-Math.abs(b.vy)*e;b.w+=b.vx*k}
      if(b.y>=my-.5&&Math.abs(b.vy)<60){            /* rolling to a stop on the floor */
        b.y=my;b.vy=0;b.vx*=1-2.2*dt;b.w+=(b.vx/38-b.w)*Math.min(1,6*dt);
        if(Math.abs(b.vx)<6&&Math.abs(b.w)<.15){b.vx=b.w=0;b.mode="rest"}
      }else{b.vx*=1-.2*dt;b.w*=1-.3*dt}
      b.w=clamp(b.w,-25,25);active=true;
    }else if(b.mode==="return"){
      const p=Math.min(1,(t-b.ret.t0)/750),q=1-Math.pow(1-p,3),r=b.ret;
      b.x=r.x0+(r.x1-r.x0)*q;b.y=r.y0+(r.y1-r.y0)*q;b.a=r.a0+(r.a1-r.a0)*q;
      if(p>=1)setHome(b,i);else active=true;
    }
    if(b.mode!=="home")place(b);
  });
  if(active)braf=requestAnimationFrame(loop);
}
function botsHome(){                              /* called when you send a chat */
  bots.forEach((b,i)=>{
    if(b.mode==="home"||b.mode==="drag"||b.mode==="return")return;
    const h=homeOf(i);
    b.ret={t0:performance.now(),x0:b.x,y0:b.y,a0:b.a,x1:h.x,y1:h.y,a1:Math.round(b.a/TAU)*TAU};
    b.mode="return";
  });
  kick();
}
function doubleBots(){                            /* press 2 three times */
  const n=bots.length;if(n>=MAXB)return;
  const add=Math.min(n,MAXB-n);
  for(let i=0;i<add;i++){
    const src=bots[i],el=tpl.cloneNode(true);
    el.removeAttribute("id");el.classList.remove("home","grab");
    $("#chat").appendChild(el);
    const b=makeBot(el),ang=Math.random()*TAU,sp=500+Math.random()*700;
    b.x=src.x;b.y=src.y;b.a=src.a;b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp-250;b.w=(Math.random()-.5)*20;b.mode="free";
    bots.push(b);place(b);
  }
  kick();
}
function botReset(){
  cancelAnimationFrame(braf);braf=0;
  while(bots.length>1)bots.pop().el.remove();
  tpl.classList.remove("grab");setHome(bots[0],0);
}
bots.push(makeBot(tpl));setHome(bots[0],0);
addEventListener("resize",()=>{bots.forEach((b,i)=>{if(b.mode==="home")setHome(b,i);else{b.x=clamp(b.x,0,innerWidth-BS);b.y=clamp(b.y,0,innerHeight-BS)}})});
let taps2=[];
addEventListener("keydown",e=>{
  if(e.key!=="2"||e.repeat||$("#chat").hidden)return;
  const n=Date.now();taps2=taps2.filter(t=>n-t<2000);taps2.push(n);
  if(taps2.length>=3){
    taps2=[];e.preventDefault();
    if(document.activeElement===cin&&cin.value.endsWith("22"))cin.value=cin.value.slice(0,-2);
    doubleBots();
  }
},true);

/* ---------- 1 x3 within 2s: back to main page ---------- */
let taps=[];
addEventListener("keydown",e=>{
  if(e.key!=="1"||e.repeat||$("#chat").hidden)return;
  const n=Date.now();taps=taps.filter(t=>n-t<2000);taps.push(n);
  if(taps.length>=3){taps=[];e.preventDefault();exitChat()}
},true);

home();
</script>
